<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Field — Interactive Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #05050a; overflow: hidden; height: 100%; }
  canvas { display: block; }

  #overlay {
    position: fixed;
    top: 0; left: 0; width: 100%;
    padding: 28px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    color: rgba(255,255,255,0.85);
    mix-blend-mode: difference;
    z-index: 10;
  }

  #title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  #hint {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-align: right;
    line-height: 1.6;
    opacity: 0.7;
  }

  #controls {
    position: fixed;
    bottom: 24px; left: 32px;
    display: flex;
    gap: 10px;
    z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
  }

  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.25);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.7); }
  .swatch.active { border-color: rgba(255,255,255,0.95); }

  #clearBtn {
    margin-left: 4px;
    padding: 5px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  #clearBtn:hover { background: rgba(255,255,255,0.16); color: #fff; }
</style>
</head>
<body>

<div id="overlay">
  <div id="title">FLOW FIELD</div>
  <div id="hint">움직여서 흐름을 만들어보세요<br>클릭하면 폭발이 일어나요</div>
</div>

<div id="controls">
  <div class="swatch active" data-palette="aurora" style="background: linear-gradient(135deg,#7dd3fc,#a78bfa,#f472b6);"></div>
  <div class="swatch" data-palette="ember" style="background: linear-gradient(135deg,#fb923c,#ef4444,#facc15);"></div>
  <div class="swatch" data-palette="forest" style="background: linear-gradient(135deg,#34d399,#22d3ee,#4ade80);"></div>
  <div class="swatch" data-palette="mono" style="background: linear-gradient(135deg,#e5e7eb,#9ca3af,#f9fafb);"></div>
  <button id="clearBtn">CLEAR</button>
</div>

<script src="vendor/p5.min.js"></script>
<script>
const PALETTES = {
  aurora: [[199,89,68],[262,72,79],[329,86,74]],
  ember:  [[24,93,64],[0,80,58],[45,93,63]],
  forest: [[158,68,58],[187,80,66],[142,69,64]],
  mono:   [[0,0,90],[0,0,65],[0,0,98]]
};

let currentPalette = 'aurora';
let particles = [];
let flowField;
let cols, rows;
const cellSize = 24;
let zOffset = 0;
let bursts = [];

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.style('position', 'fixed');
  cnv.style('top', '0');
  cnv.style('left', '0');
  colorMode(HSB, 360, 100, 100, 100);
  background(248, 25, 4);

  cols = ceil(width / cellSize);
  rows = ceil(height / cellSize);
  flowField = new Array(cols * rows);

  for (let i = 0; i < 900; i++) {
    particles.push(new Particle());
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  cols = ceil(width / cellSize);
  rows = ceil(height / cellSize);
  flowField = new Array(cols * rows);
  background(248, 25, 4);
}

function draw() {
  noiseDetail(2, 0.5);
  background(color(248, 30, 4, 10));

  let yoff = 0;
  for (let y = 0; y < rows; y++) {
    let xoff = 0;
    for (let x = 0; x < cols; x++) {
      const angle = noise(xoff, yoff, zOffset) * TWO_PI * 3;
      const idx = x + y * cols;
      flowField[idx] = p5.Vector.fromAngle(angle);
      xoff += 0.12;
    }
    yoff += 0.12;
  }
  zOffset += 0.0025;

  const mouseVec = createVector(mouseX, mouseY);
  const mouseActive = mouseX > 0 && mouseY > 0 && mouseX < width && mouseY < height;

  for (const p of particles) {
    p.follow(flowField);
    if (mouseActive) p.attract(mouseVec);
    for (const b of bursts) p.repelFrom(b);
    p.update();
    p.edges();
    p.show();
  }

  bursts = bursts.filter(b => {
    b.life -= 1;
    b.radius += 14;
    return b.life > 0;
  });
}

function mousePressed() {
  bursts.push({ x: mouseX, y: mouseY, radius: 10, life: 40 });
}

class Particle {
  constructor() {
    this.pos = createVector(random(width), random(height));
    this.vel = createVector(0, 0);
    this.acc = createVector(0, 0);
    this.maxSpeed = random(2, 4.5);
    this.prevPos = this.pos.copy();
    this.hueSeed = random(1);
  }

  follow(field) {
    const x = floor(this.pos.x / cellSize);
    const y = floor(this.pos.y / cellSize);
    const idx = constrain(x + y * cols, 0, field.length - 1);
    const force = field[idx];
    if (force) this.acc.add(p5.Vector.mult(force, 0.6));
  }

  attract(target) {
    const d = p5.Vector.sub(target, this.pos);
    const dist = d.mag();
    if (dist < 220 && dist > 1) {
      d.normalize();
      d.mult(map(dist, 0, 220, 0.5, 0.02));
      this.acc.add(d);
    }
  }

  repelFrom(burst) {
    const bp = createVector(burst.x, burst.y);
    const d = p5.Vector.sub(this.pos, bp);
    const dist = d.mag();
    if (dist < burst.radius && dist > 1) {
      d.normalize();
      d.mult(map(dist, 0, burst.radius, 6, 0));
      this.acc.add(d);
    }
  }

  update() {
    this.prevPos = this.pos.copy();
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
  }

  edges() {
    let wrapped = false;
    if (this.pos.x > width) { this.pos.x = 0; wrapped = true; }
    if (this.pos.x < 0) { this.pos.x = width; wrapped = true; }
    if (this.pos.y > height) { this.pos.y = 0; wrapped = true; }
    if (this.pos.y < 0) { this.pos.y = height; wrapped = true; }
    if (wrapped) this.prevPos = this.pos.copy();
  }

  show() {
    const stops = PALETTES[currentPalette];
    const t = (this.hueSeed + zOffset * 8) % 1;
    const segLen = 1 / (stops.length - 1);
    const segIdx = min(floor(t / segLen), stops.length - 2);
    const localT = (t - segIdx * segLen) / segLen;
    const a = stops[segIdx];
    const b = stops[segIdx + 1];
    const h = lerp(a[0], b[0], localT);
    const s = lerp(a[1], b[1], localT);
    const br = lerp(a[2], b[2], localT);

    stroke(h, s, br, 55);
    strokeWeight(1.6);
    line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
  }
}

document.querySelectorAll('.swatch').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    currentPalette = el.dataset.palette;
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  background(248, 30, 4);
});
</script>

</body>
</html>
